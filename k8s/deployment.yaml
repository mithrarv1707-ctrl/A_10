apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calc-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-calc
  template:
    metadata:
      labels:
        app: grade-calc
    spec:
      containers:
        - name: grade-calc-container
          image: mithra1707/grade-calc:PUSH_1_COMMIT_SHA
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5